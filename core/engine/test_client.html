<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Neura-Core v2 — Gateway test client</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 24px; }
      h1 { font-size: 18px; }
      .card { border: 1px solid #30363d; border-radius: 10px; padding: 14px; margin-bottom: 14px; background: #161b22; }
      code, pre { font-family: ui-monospace, monospace; }
      .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
      #frame { font-size: 14px; }
      .badge { border: 1px solid #30363d; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
      input { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; padding: 6px 8px; }
      button { background: #1f6feb; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Neura-Core v2 · Gateway test client (SSE)</h1>
    <div class="card">
      <span class="badge">GET /v2/affect</span>
      <span class="badge">Auth: X-Tenant-Id + X-Api-Key</span>
      <p id="frame"><span class="dot" id="dot" style="background:#8b93a7"></span>Conectando…</p>
      <button id="connect">Reconectar</button>
    </div>
    <div class="card">
      <span class="badge">POST /v2/turn</span>
      <p>
        <input id="userMessage" value="hola" placeholder="mensaje" />
        <button id="sendTurn">Enviar turno</button>
        <pre id="turnResult">—</pre>
      </p>
    </div>
    <script>
      const dot = document.getElementById('dot');
      const frame = document.getElementById('frame');
      let source = null;

      function connect() {
        if (source) source.close();
        frame.textContent = 'Conectando…';
        source = new EventSource('http://127.0.0.1:8443/v2/affect', { withCredentials: false });
        source.addEventListener('affect', (event) => {
          const data = JSON.parse(event.data);
          dot.style.background = data.hexColor;
          frame.textContent = `V ${data.valence.toFixed(2)} · A ${data.arousal.toFixed(2)} · D ${data.dominance.toFixed(2)} · ${data.hexColor}`;
        });
        source.onerror = () => { frame.textContent = 'Sin conexión con el gateway (127.0.0.1:8443)'; };
      }
      document.getElementById('connect').addEventListener('click', connect);
      connect();

      document.getElementById('sendTurn').addEventListener('click', async () => {
        const message = document.getElementById('userMessage').value;
        const res = await fetch('http://127.0.0.1:8443/v2/turn', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Tenant-Id': 'default', 'X-Api-Key': 'dev-key' },
          body: JSON.stringify({ agent_id: 'Neura', user_message: message, payload_json: '' }),
        });
        document.getElementById('turnResult').textContent = await res.text();
      });
    </script>
  </body>
</html>
